[package]
name = "autonomous-driving"
version = "0.1.0"
edition = "2024"

[lib]
name = "autonomous_driving"
path = "src/lib.rs"

[[bin]]
name = "autonomous_driving_bin"
path = "src/main.rs"

[dependencies]
env_logger = "0.11.11"
glam = { version = "0.33.6", features = ["serde"] }
image = "0.25.10"
log = "0.4.34"
macroquad = "0.4.16"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
